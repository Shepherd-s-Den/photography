photography {
  sqlite {
    path = "/data/photography.db"
    path = ${?PHOTOGRAPHY_SQLITE_PATH}
    connection-acquisition-threads = 2
    max-sessions = 8
  }
  albums {
    page-size = 6
    page-size = ${?PHOTOGRAPHY_ALBUMS_PAGE_SIZE}
  }
  http {
    host = "127.0.0.1"
    host = ${?PHOTOGRAPHY_HOST}
    port = 8080
    port = ${?PHOTOGRAPHY_PORT}
  }
}
