photography {
  sqlite {
    path = "/data/photography.db"
    path = ${?PHOTOGRAPHY_SQLITE_PATH}
    connection-acquisition-threads = 2
    max-sessions = 8
  }
  albums {
    page-size = 6
    page-size = ${?PHOTOGRAPHY_ALBUMS_PAGE_SIZE}
    photo-root = "/photos"
    photo-root = ${?PHOTOGRAPHY_PHOTO_ROOT}
  }
  thumbnails {
    quality = "standard"
    quality = ${?PHOTOGRAPHY_THUMBNAIL_QUALITY}
    root = "/thumbnails"
    root = ${?PHOTOGRAPHY_THUMBNAIL_ROOT}
  }
  http {
    host = "127.0.0.1"
    host = ${?PHOTOGRAPHY_HOST}
    port = 8080
    port = ${?PHOTOGRAPHY_PORT}
  }
}
